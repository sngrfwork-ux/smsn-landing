<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LowMap · Юридическая практика</title><style id="social-style">* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
.social {
  --ink: #172b46;
  --muted: #607187;
  --line: #dde5ed;
  --accent: #145bbc;
  --light: #e8f1ff;
  background: #f4f7fb;
  color: var(--ink);
  min-height: 100vh;
  font:
    15px/1.48 Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}
.social.purple {
  --accent: #7040ad;
  --light: #f0eafb;
  background: #f7f5fb;
}
.social a {
  color: inherit;
  text-decoration: none;
}
.social .read,
.social a:hover {
  color: var(--accent);
}
.social h1,
.social h2,
.social h3,
.social p {
  margin: 0 0 13px;
}
.social h1 {
  font-size: clamp(27px, 3vw, 40px);
  line-height: 1.1;
  letter-spacing: -0.05em;
}
.social h2 {
  font-size: clamp(21px, 2vw, 28px);
  line-height: 1.15;
  letter-spacing: -0.035em;
}
.social h3 {
  font-size: 18px;
}
.social small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}
.social button,
.social .primary,
.social .file {
  font: inherit;
  border: 0;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  padding: 9px 14px;
  font-weight: 600;
}
.social button:disabled {
  opacity: 0.55;
}
.social .quiet,
.social .file {
  background: #eff3f7;
  color: var(--ink);
}
.social .marked {
  background: var(--light);
  color: var(--accent);
}
.social a.primary {
  display: inline-block;
  color: white;
  text-align: center;
}
.social input,
.social textarea,
.social select {
  width: 100%;
  min-width: 0;
  border: 1px solid #cbd6e2;
  border-radius: 9px;
  background: white;
  color: var(--ink);
  font: inherit;
  padding: 10px 12px;
}
.social label {
  display: grid;
  gap: 5px;
  font-weight: 600;
}
.social form {
  display: grid;
  gap: 12px;
}
.social textarea {
  resize: vertical;
}
.social .top {
  height: 70px;
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 5%;
  padding: 0 max(3vw, calc((100vw - 1420px) / 2));
  background: #fffffff5;
  border-bottom: 1px solid var(--line);
}
.social .top input {
  max-width: 540px;
  background: #f1f5fa;
  border-color: transparent;
}
.social .top > div {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 23px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-weight: 800;
  letter-spacing: -0.045em;
  font-size: 26px;
}
.brand i {
  border-radius: 9px;
  background: var(--accent);
  color: white;
  display: grid;
  place-items: center;
  font: 23px Georgia;
  width: 36px;
  height: 36px;
}
.layout {
  max-width: 1460px;
  margin: auto;
  display: grid;
  grid-template-columns: 196px minmax(0, 1fr) minmax(230px, 290px);
  gap: 22px;
  padding: 24px 3vw 70px;
}
.layout.wide {
  grid-template-columns: 170px minmax(0, 1fr);
}
.rail {
  align-self: start;
  position: sticky;
  top: 96px;
  display: grid;
  gap: 5px;
}
.rail > a,
.account {
  padding: 12px 10px;
  display: flex;
  gap: 9px;
  align-items: center;
  font-weight: 550;
  border-radius: 9px;
}
.rail i {
  font: 20px Arial;
  width: 24px;
  text-align: center;
}
.rail a.sel,
.contact.current {
  background: var(--light);
  color: var(--accent);
}
.account {
  border-top: 1px solid var(--line);
  margin-top: 25px;
  padding-top: 20px;
  display: grid;
}
.account button {
  font-size: 12px;
}
.pageheading {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
}
.social .pageheading h1 {
  margin: 0;
}
.feedtabs,
.actions,
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.feedtabs {
  margin-bottom: 15px;
}
.feedtabs button {
  background: transparent;
  color: var(--muted);
}
.feedtabs button.active {
  background: var(--ink);
  color: white;
}
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px #18334d05;
  overflow-wrap: anywhere;
}
.byline,
.contact {
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #dce8f5;
  color: #355171;
  font-weight: 700;
  font-size: 15px;
  object-fit: cover;
}
.av4,
.av1 {
  background: #dcece5;
  color: #316750;
}
.av5,
.av2 {
  background: #f5e8d9;
  color: #725137;
}
.tags {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0 10px;
}
.tags span {
  color: var(--accent);
  background: var(--light);
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 650;
}
.post p {
  line-height: 1.6;
}
.cover {
  display: flex;
  background: #19344e;
  color: white;
  align-items: center;
  overflow: hidden;
  border-radius: 10px;
  margin: 15px 0;
  font-size: 13px;
  gap: 18px;
}
.cover img {
  width: 40%;
  height: 138px;
  object-fit: cover;
}
.cover strong {
  font-size: 22px;
  line-height: 1.15;
  display: block;
  margin-top: 4px;
  letter-spacing: -0.035em;
}
.post .actions {
  border-top: 1px solid var(--line);
  margin: 14px 0 0;
  padding-top: 12px;
}
.actions button,
.actions a {
  font-size: 13px;
}
.read {
  display: inline-block;
  font-weight: 650;
  margin: 7px 0;
}
.pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.right {
  padding-top: 8px;
}
.right > h3 {
  font-size: 14px;
  color: var(--muted);
}
.expert {
  padding: 0;
  overflow: hidden;
}

.expertbody {
  padding: 0 18px 18px;
}
.expertbody > .avatar {
  border: 4px solid white;
  width: 70px;
  height: 70px;
  margin-top: -30px;
  margin-bottom: 7px;
}
.expertbody h2 {
  font-size: 21px;
}
.expertbody small {
  margin: 5px 0 12px;
}
.expertbody > .primary,
.expertbody > button {
  display: block;
  width: 100%;
  margin-top: 8px;
}
.side button {
  display: block;
  text-align: left;
  margin: 6px 0;
  width: 100%;
}
.item {
  display: block;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.workgrid {
  display: grid;
  gap: 10px;
  grid-template-columns: 1fr 1fr;
}
.worklink h2 {
  font-size: 19px;
}
.filters label {
  flex: 1;
}
.comment {
  margin: 16px 0;
}
.social output {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  background: #18304a;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  max-width: 90vw;
}
.login {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 24px;
}
.gate {
  width: min(420px, 92vw);
  overflow: hidden;
  padding: 0;
}
.gate > div:last-child {
  padding: 24px;
}
.gate button {
  margin-top: 18px;
  width: 100%;
}
.chats {
  display: grid;
  grid-template-columns: minmax(160px, 0.6fr) minmax(0, 1.4fr);
  gap: 10px;
}
.chats.haspanel {
  grid-template-columns: minmax(155px, 0.55fr) minmax(220px, 1fr) minmax(
      195px,
      0.8fr
    );
}
.chats .card {
  padding: 16px;
}
.contacts input {
  margin: 8px 0 14px;
}
.contact {
  padding: 10px 6px;
  border-radius: 9px;
}
.contact span:last-child {
  min-width: 0;
}
.contact small {
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
}
.history {
  height: clamp(250px, 49vh, 580px);
  overflow: auto;
  margin: 15px 0;
  background: #faf9fd;
  padding: 10px;
  border-radius: 10px;
}
.bubble {
  width: fit-content;
  max-width: 90%;
  padding: 10px;
  border-radius: 12px;
  background: #edeff4;
  margin: 6px 0;
}
.bubble.mine {
  margin-left: auto;
  background: #ece3f9;
}
.bubble button,
.attachment button {
  background: white;
  color: var(--accent);
  font-size: 13px;
}
.bubble small {
  text-align: right;
}
.file input {
  width: 1px;
  height: 1px;
  position: absolute;
  opacity: 0;
}
.preview iframe {
  width: 100%;
  height: 40vh;
  border: 0;
}
.back {
  display: inline-block;
  font-size: 13px;
  margin-bottom: 12px;
}
.empty {
  color: var(--muted);
}
.expert h3 {
  margin-top: 18px;
}
@media (max-width: 1150px) {
  .layout {
    grid-template-columns: 162px minmax(0, 1fr) 215px;
    gap: 12px;
  }
  .layout.wide {
    display: block;
  }
  .wide .rail {
    position: static;
    display: flex;
    margin-bottom: 14px;
  }
  .wide .account {
    display: none;
  }
}
@media (max-width: 920px) {
  .layout {
    grid-template-columns: 160px minmax(0, 1fr);
  }
  .right {
    display: none;
  }
}
@media (max-width: 720px) {
  .social .top {
    height: auto;
    min-height: 59px;
    flex-wrap: wrap;
    gap: 7px;
    padding: 10px 14px;
  }
  .social .top input {
    order: 3;
    max-width: none;
    padding: 7px 12px;
  }
  .social .top > div {
    gap: 13px;
  }
  .layout,
  .layout.wide {
    display: block;
    padding: 12px 12px 60px;
  }
  .rail,
  .wide .rail {
    position: static;
    display: flex;
    overflow-x: auto;
    margin-bottom: 18px;
    gap: 3px;
  }
  .rail > a {
    white-space: nowrap;
    padding: 7px 9px;
    font-size: 13px;
  }
  .rail i {
    display: none;
  }
  .rail .account,
  .wide .account {
    display: block;
    padding: 0;
    border: 0;
    margin: 0;
  }
  .account .byline {
    display: none;
  }
  .account button {
    white-space: nowrap;
  }
  .card {
    padding: 16px;
  }
  .expert,
  .gate {
    padding: 0;
  }
  .cover img {
    height: 110px;
  }
  .cover strong {
    font-size: 18px;
  }
  .chats,
  .chats.haspanel {
    display: block;
  }
  .chats .conversation,
  .chats.haspeer .contacts,
  .chats.haspanel .conversation {
    display: none;
  }
  .chats.haspeer .conversation {
    display: block;
  }
  .chats.haspanel .conversation {
    display: none;
  }
  .contact {
    padding: 13px 4px;
  }
  .history {
    height: 42vh;
  }
  .workgrid {
    grid-template-columns: 1fr;
  }
  .social .top .avatar {
    width: 32px;
    height: 32px;
  }
  .social .expertbody > .avatar {
    width: 60px;
    height: 60px;
  }
  .actions {
    gap: 5px;
  }
  .post .actions button {
    padding: 7px 9px;
  }
}
.feed-home .pageheading,.feed-home .right>h3,.feed-home .right .side{display:none}

body {
  margin: 0;
  background: #f3f5f8;
  color: #192b43;
  font:
    15px/1.5 Inter,
    Arial,
    sans-serif;
}
.shell {
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr);
  min-height: 100vh;
}
aside {
  background: #132940;
  color: white;
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
}
aside strong {
  font-size: 23px;
  letter-spacing: 0.06em;
}
aside small,
footer {
  color: #bbccda;
}
nav {
  display: grid;
  gap: 6px;
  margin-top: 40px;
}
button,
select,
input {
  font: inherit;
}
button,
summary,
select {
  cursor: pointer;
}
button {
  background: #16685a;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 600;
}
button:disabled {
  opacity: 0.55;
}
nav button {
  text-align: left;
  background: transparent;
  color: #daebf1;
}
nav .active,
nav button:hover {
  background: #2e465c;
}
footer {
  margin-top: auto;
  padding-top: 40px;
  font-size: 12px;
}
header,
.heading,
.tabs,
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
header {
  padding: 18px 4%;
  background: white;
  border-bottom: 1px solid #dae2e8;
}
header label {
  display: flex;
  align-items: center;
  gap: 10px;
}
section {
  padding: 32px 4%;
  max-width: 1450px;
  margin: auto;
}
h1 {
  font-size: clamp(27px, 3vw, 44px);
  letter-spacing: -0.045em;
  margin: 0;
}
h2 {
  margin: 30px 0 14px;
}
h3 {
  margin: 6px 0 12px;
}
.metrics,
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(205px, 100%), 1fr));
  gap: 14px;
  margin: 22px 0;
}
article,
form,
details,
.row {
  background: white;
  border: 1px solid #dbe2e7;
  border-radius: 12px;
  padding: 20px;
}
.metrics article {
  color: #506378;
}
.metrics b {
  display: block;
  font-size: 25px;
  color: #19324b;
  margin-top: 10px;
}
.cards strong {
  font-size: 26px;
}
.field {
  border-top: 1px solid #e4ebef;
  padding: 10px 0;
}
.field small,
small {
  display: block;
  color: #61778a;
}
.cards button {
  margin-top: 12px;
}
.row {
  width: 100%;
  text-align: left;
  color: inherit;
  margin-bottom: 10px;
}
.row div {
  flex: 1;
}
.row em {
  font-style: normal;
  background: #e4f2ed;
  color: #186452;
  padding: 5px 12px;
  border-radius: 15px;
}
.row span,
.subtitle {
  color: #61778a;
}
.tabs {
  justify-content: flex-start;
  margin: 20px 0;
}
.tabs button {
  background: #e2eaee;
  color: #263f51;
}
form {
  display: grid;
  gap: 14px;
  max-width: 700px;
  margin: 16px 0;
}
label {
  display: grid;
  gap: 5px;
}
select,
input {
  min-width: 0;
  border: 1px solid #bac9d2;
  border-radius: 7px;
  padding: 9px;
  background: white;
  color: #172f43;
}
.upload,
details {
  margin: 12px 0;
}
.upload {
  max-width: 430px;
}
a {
  color: #16685a;
}
[role="alert"] {
  color: #943c24;
  padding: 10px 4%;
}
@media (max-width: 760px) {
  .shell {
    display: block;
  }
  aside {
    padding: 12px 15px;
  }
  aside small,
  footer {
    display: none;
  }
  nav {
    display: flex;
    overflow: auto;
    margin-top: 8px;
  }
  nav button {
    white-space: nowrap;
  }
  section {
    padding: 22px 14px;
  }
  header {
    padding: 10px 14px;
  }
  .metrics {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  }
  .metrics article {
    padding: 12px;
  }
  .metrics b {
    font-size: 18px;
  }
  .cards {
    grid-template-columns: 1fr;
  }
}
