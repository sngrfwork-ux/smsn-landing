<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17304c"><title>Universal Platform — интерактивный предпросмотр</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#203450;background:#f6f8fc;--line:#e3e9f2;--muted:#8290a5;--blue:#4168df;--deep:#152f51}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a4b6fb;outline-offset:3px}svg{flex-shrink:0}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;background:#fff;border-right:1px solid var(--line);height:100vh;display:flex;flex-direction:column;padding:27px 17px}.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:850;color:#213857;letter-spacing:-.6px;padding:0 9px 29px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(150deg,#3c72df,#7d7fee);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 8px 18px #4267da2c}.brand span small{display:block;font-size:10px;font-weight:600;color:#94a2b3;letter-spacing:.1px;margin-top:2px}.side-title{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#9cabc0;margin:19px 11px 11px}.orgsel{background:#f6f8fd;border:1px solid #e8edf7;border-radius:10px;padding:12px;width:100%;color:#293d5b;font-size:12px;font-weight:650}.nav{display:grid;gap:5px}.nav button,.nav a{border:0;background:transparent;color:#76859c;width:100%;display:flex;align-items:center;gap:12px;min-height:45px;padding:11px 13px;border-radius:9px;text-align:left;font-weight:650;font-size:13px}.nav button:hover,.nav a:hover{background:#f1f5fc;color:#345ac8}.nav button.active{background:#ebf1ff;color:#3c61ce}.nav .dot{margin-left:auto;font-size:10px;background:#e8eefb;color:#4868c3;padding:4px 7px;border-radius:10px}.bottom{margin-top:auto;border-top:1px solid #eef1f5;padding:22px 8px 4px;color:#7b8aa0;font-size:11px;line-height:1.6}.bottom strong{display:block;color:#334867}.content{min-width:0}.top{height:78px;display:flex;justify-content:space-between;align-items:center;padding:0 5%;background:#fff;border-bottom:1px solid #e7edf5}.top-left{display:flex;align-items:center;gap:12px;font-size:12px;color:#99a4b5}.top-left b{color:#4d607c}.top-right{display:flex;align-items:center;gap:12px}.tag{font-size:11px;border-radius:20px;padding:8px 12px;background:#fff4df;color:#996c19;border:1px solid #f1e5cc;font-weight:700}.menu-btn{display:none;border:0;background:#eff3ff;border-radius:9px;padding:8px;color:#3659b4}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#dce9ff;color:#426bd5;font-weight:800;font-size:13px}.workspace{padding:43px 5% 75px;max-width:1440px;margin:0 auto}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800;color:#6881b1;margin:0 0 9px}.headline{display:flex;justify-content:space-between;align-items:center;gap:12px}.headline h1{font-size:36px;letter-spacing:-1.5px;line-height:1.15;margin:0 0 8px;color:#263b5a}.subtitle{font-size:13px;color:#8693aa;line-height:1.6;margin:0 0 31px}.mini-date{font-size:11px;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:30px;color:#8997ad}.grid{display:grid;gap:18px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:21px}.card{border:1px solid var(--line);background:white;border-radius:14px;padding:25px;box-shadow:0 7px 25px #1c407309}.metric{min-height:174px}.micon{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#eef1ff;color:#506dd7;font-size:22px;margin-bottom:18px}.metric-label{font-size:12px;color:#7a88a2}.metric-value{font-size:30px;letter-spacing:-.8px;font-weight:800;margin:8px 0}.metric-foot{font-size:11px;color:#9aa6b8}.cols{grid-template-columns:1.12fr .88fr}.card h2{font-size:19px;letter-spacing:-.35px;margin:0 0 8px}.card p{font-size:12px;color:#8492a4;line-height:1.75;margin:0 0 22px}.steps{display:grid;gap:15px;margin:22px 0}.step{display:flex;gap:12px;align-items:center}.circle{width:30px;height:30px;border-radius:50%;background:#e9f7f0;color:#2ba277;display:grid;place-items:center;font-weight:800;font-size:12px}.step label{display:grid;gap:3px}.step strong{font-size:12px}.step small{font-size:11px;color:#9ba8b9}.btn{border:1px solid #dce5f3;background:#fff;color:#385dca;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;font-size:12px;font-weight:750;min-height:42px}.btn:hover{background:#f2f6ff}.btn.primary{background:#4169df;border-color:#4169df;color:#fff}.btn.primary:hover{background:#3158d2}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-plain{border:0;background:transparent;color:#4569ce;font-size:12px;font-weight:700}.taskline{padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #edf0f6;font-size:13px}.taskline:last-child{border-bottom:0}.check{width:18px;height:18px;border:2px solid #bfcce0;border-radius:6px;flex-shrink:0}.t-left{display:flex;align-items:center;gap:12px;min-width:0}.t-left span{overflow-wrap:anywhere}.tdate{color:#a6b1c0;font-size:10px}.empty{padding:24px;text-align:center;color:#94a0b5;font-size:12px}.modulegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.module{min-height:275px;display:flex;flex-direction:column;align-items:flex-start}.module .micon{width:54px;height:54px;font-size:28px}.module h2{font-size:20px;margin-bottom:7px}.module p{max-width:400px}.module .btn{margin-top:auto}.pill{padding:5px 9px;border-radius:18px;font-size:11px;font-weight:700;background:#eaf7f1;color:#279376}.pill.gray{background:#f2f4f8;color:#7e8a9d}.module-top{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:14px}.form{display:grid;gap:10px;max-width:650px}.form input{border:1px solid #dce5ef;border-radius:9px;min-height:46px;padding:10px 14px;font-size:13px;width:100%}.form label{font-size:12px;font-weight:700}.muted{color:#8290a4;font-size:12px;line-height:1.6}.hint{background:#fff8e9;border:1px solid #eee2c9;border-radius:12px;padding:13px 16px;color:#987a3b;font-size:12px;line-height:1.6;margin:0 0 25px}.row{display:flex;gap:10px;align-items:center}.row.split{justify-content:space-between}.card + .card{margin-top:17px}.fade{animation:appear .18s ease}@keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}.btn-danger{border:0;background:transparent;font-size:12px;color:#b66b72;cursor:pointer}@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.metrics .card:last-child{grid-column:span 2}.cols{grid-template-columns:1fr}.workspace{padding:35px 4% 65px}.top{padding:0 4%}}@media(max-width:780px){.shell{grid-template-columns:1fr}.side{position:fixed;top:0;left:0;bottom:0;width:255px;transform:translateX(-110%);transition:.2s;z-index:50;box-shadow:15px 0 30px #142d511b}.side.open{transform:translateX(0)}.menu-btn{display:block}.workspace{padding:27px 18px 50px}.top{padding:0 18px;height:66px}.headline h1{font-size:30px}.mini-date{display:none}.modulegrid{grid-template-columns:1fr}}@media(max-width:480px){.metrics{grid-template-columns:repeat(2,1fr);gap:10px}.metrics .card{padding:16px;min-height:155px}.metrics .card:last-child{grid-column:span 2;min-height:130px}.card{padding:18px}.metric-value{font-size:24px}.tag{font-size:9px}.top-left{font-size:10px}.module{min-height:260px}}
</style></head>
<body><div class="shell">
<aside class="side" id="sidebar"><div class="brand"><div class="mark">U</div><span>Universal Platform<small>Модульная цифровая платформа</small></span></div><div class="side-title">ПРОСТРАНСТВО</div><select class="orgsel" id="org" aria-label="Демонстрационная организация"><option value="alpha">Демо-компания Альфа</option><option value="beta">Демо-компания Бета</option></select><div class="side-title">РАБОЧАЯ ОБЛАСТЬ</div><nav class="nav" aria-label="Главная навигация"><button data-nav="overview" class="active">▦ <span>Обзор</span></button><button data-nav="tasks">☑ <span>Задачи</span></button><button data-nav="modules">▧ <span>Модули</span></button><a href="legal-demo/index.html">⚖ <span>Закон рядом</span><span class="dot">Демо</span></a><button data-nav="settings">⚙ <span>Настройки</span></button></nav><div class="bottom"><strong>Предпросмотр интерфейса</strong>Данные задач хранятся только в этом браузере. Не вводите реальную информацию.</div></aside>
<div class="content"><header class="top"><div class="top-left"><button class="menu-btn" id="openMenu" type="button" aria-label="Открыть меню">☰</button>Рабочее пространство <span>/</span> <b id="crumb">Обзор</b></div><div class="top-right"><span class="tag">Интерактивное демо</span><div class="avatar">UP</div></div></header><main class="workspace fade" id="view"></main></div>
</div><script>
(function(){'use strict';
var org=document.getElementById('org'),view=document.getElementById('view'),side=document.getElementById('sidebar');
var page='overview';
var names={overview:'Обзор',tasks:'Задачи',modules:'Модули',settings:'Настройки'};
function key(){return 'upc-static-preview-v1-'+org.value}
function initial(){return {active:true,tasks:[{id:'seed1',title:'Проверить архитектуру MVP',date:'Сегодня'},{id:'seed2',title:'Посмотреть модуль «Закон рядом»',date:'Сегодня'}]}}
function get(){try{return JSON.parse(localStorage.getItem(key()))||initial()}catch(e){return initial()}}
function save(s){try{localStorage.setItem(key(),JSON.stringify(s))}catch(e){alert('Браузер запретил сохранение демонстрационных данных')}}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function head(t,sub){return '<div class="headline"><div><div class="eyebrow">UNIVERSAL PLATFORM / DEMO</div><h1>'+t+'</h1></div><span class="mini-date">Sprint 1 · Preview</span></div><p class="subtitle">'+sub+'</p>'}
function render(){var s=get(),items=s.tasks||[];document.getElementById('crumb').textContent=names[page];document.querySelectorAll('[data-nav]').forEach(function(x){x.classList.toggle('active',x.dataset.nav===page)});
var hint='<div class="hint">Это статический предпросмотр для публикации без сервера. Регистрация, изоляция организаций и права доступа здесь имитируются. В полном серверном варианте используются API и PostgreSQL.</div>';
if(page==='overview')view.innerHTML=head('Рабочий стол','Одно пространство для команды, процессов и подключаемых модулей.')+hint+'<div class="grid metrics"><section class="card metric"><div class="micon">☑</div><div class="metric-label">Задачи</div><div class="metric-value">'+items.length+'</div><div class="metric-foot">В этой демонстрационной организации</div></section><section class="card metric"><div class="micon">▧</div><div class="metric-label">Активные модули</div><div class="metric-value">'+(s.active?1:0)+'</div><div class="metric-foot">Включаются в каталоге</div></section><section class="card metric"><div class="micon">⚖</div><div class="metric-label">Юридическая биржа</div><div class="metric-value">Демо</div><div class="metric-foot">Полный цикл запрос → отклик → сделка</div></section></div><div class="grid cols"><section class="card"><h2>Быстрый старт</h2><p>Пройдите короткий сценарий настройки рабочей области.</p><div class="steps"><div class="step"><div class="circle">✓</div><label><strong>Пространство создано</strong><small>Тестовая организация готова</small></label></div><div class="step"><div class="circle">'+(s.active?'✓':'2')+'</div><label><strong>Модуль задач</strong><small>'+(s.active?'Модуль включён':'Включите в каталоге')+'</small></label></div><div class="step"><div class="circle">'+(items.length?'✓':'3')+'</div><label><strong>Первая задача</strong><small>'+(items.length?'Добавлена в демо-пространство':'Создайте задачу')+'</small></label></div></div><button class="btn primary" data-go="'+(s.active?'tasks':'modules')+'">'+(s.active?'Открыть задачи':'Подключить модуль')+' →</button></section><section class="card"><div class="row split"><h2>Последние задачи</h2><button class="btn-plain" data-go="tasks">Все задачи</button></div>'+(items.length?items.slice(-5).reverse().map(function(t){return '<div class="taskline"><div class="t-left"><div class="check"></div><span>'+esc(t.title)+'</span></div><small class="tdate">'+esc(t.date)+'</small></div>'}).join(''):'<div class="empty">Список задач пуст</div>')+'</section></div>';
if(page==='modules')view.innerHTML=head('Каталог модулей','Подключайте нужные бизнес-инструменты в единое рабочее пространство.')+hint+'<div class="grid modulegrid"><section class="card module"><div class="module-top"><div class="micon">☑</div><span class="pill '+(s.active?'':'gray')+'">'+(s.active?'Активен':'Не подключён')+'</span></div><h2>Задачи</h2><p>Список задач и создание новых объектов в текущем пространстве.</p><button class="btn '+(s.active?'':'primary')+'" data-toggle="1">'+(s.active?'Отключить':'Подключить модуль')+'</button></section><section class="card module"><div class="module-top"><div class="micon">⚖</div><span class="pill gray">UX-прототип</span></div><h2>Закон рядом</h2><p>Запросы, предложения юристов, согласование сделки, сдача и приёмка, доработка, споры. Не подключён к серверным данным.</p><a href="legal-demo/index.html" class="btn primary">Открыть бизнес-процесс →</a></section></div>';
if(page==='tasks')view.innerHTML=head('Задачи','Планируйте работу в одном рабочем пространстве.')+hint+(!s.active?'<div class="card"><h2>Модуль не подключён</h2><p>Включите его через каталог модулей.</p><button class="btn primary" data-go="modules">Открыть модули →</button></div>':'<div class="grid cols"><section class="card"><h2>Новая задача</h2><p>Задачи этого предпросмотра сохраняются локально в браузере.</p><form class="form" id="taskForm"><label for="taskTitle">Название задачи</label><input id="taskTitle" required maxlength="200" placeholder="Например, провести встречу команды" autocomplete="off"><button class="btn primary" type="submit">+ Создать задачу</button></form></section><section class="card"><div class="row split"><h2>Все задачи</h2><span class="pill gray">'+items.length+'</span></div>'+(items.length?items.slice().reverse().map(function(t){return '<div class="taskline"><div class="t-left"><div class="check"></div><span>'+esc(t.title)+'</span></div><button class="btn-danger" data-delete="'+esc(t.id)+'" aria-label="Удалить задачу">Удалить</button></div>'}).join(''):'<div class="empty">Задач пока нет. Создайте первую.</div>')+'</section></div>');
if(page==='settings')view.innerHTML=head('Настройки','Сведения о демонстрационном рабочем пространстве.')+hint+'<div class="card"><h2>'+esc(org.options[org.selectedIndex].text)+'</h2><p>Режим: автономный предпросмотр, без регистрации пользователей и сервера. Можно переключить демонстрационную организацию в левом меню. Для реальной защиты данных требуется серверная версия.</p><button class="btn" id="reset">Сбросить данные этой организации</button></div>';
}
function navigate(p){if(!names[p])return;page=p;side.classList.remove('open');render()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-go],[data-nav],[data-toggle],[data-delete],#reset');if(!t)return;if(t.dataset.go)navigate(t.dataset.go);if(t.dataset.nav)navigate(t.dataset.nav);if(t.dataset.toggle){var s=get();s.active=!s.active;save(s);render()}if(t.dataset.delete){var x=get();x.tasks=x.tasks.filter(function(a){return a.id!==t.dataset.delete});save(x);render()}if(t.id==='reset'){if(confirm('Сбросить демонстрационные данные?')){localStorage.removeItem(key());render()}}});
document.addEventListener('submit',function(e){if(e.target.id!=='taskForm')return;e.preventDefault();var input=document.getElementById('taskTitle'),title=input.value.trim();if(!title)return;var s=get();s.tasks.push({id:'task-'+Date.now()+'-'+Math.random().toString(36).slice(2),title:title,date:new Date().toLocaleDateString('ru-RU')});save(s);render()});
org.addEventListener('change',render);document.getElementById('openMenu').addEventListener('click',function(){side.classList.toggle('open')});render();
})();
</script></body></html>
