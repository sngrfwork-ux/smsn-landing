`<div class="chips mb16">${sChip(r.status)}${chip(r.area)}${chip('Версия '+r.version,'blue')}${r.organization?chip(r.organization):''}</div>`+

function renderClientOffers(r,all){return `<section class="card"><div class="card-title"><h2>Отклики специалистов</h2>${chip(all.length+' предложений','blue')}</div>${all.length?`<p class="text-sm muted">Сравните цену, срок, результат и исключения. Устаревший отклик нельзя выбрать до обновления условий.</p><div class="offer-list">${all.map(p=>renderOffer(p,r)).join('')}</div>`:emptyBox('Откликов пока нет','Специалисты увидят запрос на закрытой бирже. Вы можете изменить описание.')}</section>`;}

function renderLawyerOffer(r,mine){return `<section class="card"><div class="card-title"><h2>${mine?'Ваш отклик':'Предложить помощь'}</h2>${mine?chip('№ '+mine.id,'blue'):chip('Новый отклик','green')}</div>${mine?`<div class="chips mb16">${stale(mine,r)?chip('Требуется обновление','amber'):preliminary(mine)?chip('Предварительные условия','amber'):chip('Актуальные условия','green')}</div><div class="kv"><div class="k">Результат</div><div class="v">${e(mine.result)}</div><div class="k">Стоимость</div><div class="v">${e(price(mine))}</div><div class="k">Срок</div><div class="v">${mine.termDays?mine.termDays+' дней':'Нужно уточнить'}</div><div class="k">Исключения</div><div class="v">${e(mine.exclusions||'—')}</div></div><div class="line"></div>${button(stale(mine,r)?'Обновить под версию '+r.version:'Изменить предложение','offer','primary',`data-id="${e(r.id)}"`,'edit')}${button('Переписка с клиентом','chat','secondary',`data-request="${e(r.id)}" data-lawyer="${e(state.userId)}"`,'message')}`:r.status==='published'?`<p class="text-sm muted">Укажите конкретный результат, цену, срок и исключения. Можно задать вопрос или отметить условия предварительными.</p>${button('Откликнуться','offer','primary',`data-id="${e(r.id)}"`,'plus')}`:notice('Приём новых откликов закрыт.','warn')}</section>`;}

function dealStepper(d){const steps=['selected','in_work','on_acceptance','completed'];let idx=d.status==='selected'?0:d.status==='in_work'?1:d.status==='on_acceptance'?2:d.status==='revision'?2:d.status==='completed'?3:d.status==='terminated'?2:Math.max(0,steps.indexOf(d.previousStatus));return `<div class="stepper">${steps.map((s,i)=>`<div class="step-node ${i<idx?'passed':i===idx?'active':''}"><span class="step-ball">${i<idx?ico('check',13):i+1}</span><span class="step-label">${['Исполнитель выбран','В работе','Приёмка','Завершена'][i]}</span></div>${i<steps.length-1?`<div class="step-line ${i<idx?'passed':''}"></div>`:''}`).join('')}</div>`;}

if(s==='on_acceptance')return self==='client'?'Откройте последнюю сдачу и примите результат или запросите доработку.':'Ожидается решение уполномоченного клиента по переданной сдаче.';

function renderFinance(d){const cost=d.terms.priceType==='fixed'?Number(d.terms.price)||0:null,paid=Number(d.finance.paid)||0,rest=cost!==null?Math.max(0,cost-paid):null,label=cost===null?'Уточняется':paid===0?'Не оплачено':paid>=cost?'Оплачено':'Частично оплачено';

const grounds={objection:'Мотивированное возражение по замечанию',termination:'Отклонение условий прекращения',repeat:'Недостаток сохранился после доработки',deadline:'Пропущен установленный срок'};
const ground=v('ground');if(!grounds[ground])throw Error('Основание не определено.');
d.previousStatus=d.status;d.status='dispute_open';d.dispute={id:'DISP-'+Date.now(),initiatedBy:state.userId,ground:grounds[ground],description:v('description'),outcome:v('outcome'),openedAt:now(),snapshot:{terms:copy(d.terms),termsVersion:d.termsVersion,submissions:copy(d.submissions),objections:copy(d.objections),previousStatus:d.previousStatus},answers:[],settlement:null};log(d,'Открыт спор: '+grounds[ground]);message='Спор открыт. Условия и версии зафиксированы';
}
else if(m.type==='dispute-answer'){
if(!d||d.status!=='dispute_open'||!canDeal(d))throw Error('Пояснение недоступно.');d.dispute.answers.push({by:state.userId,text:v('text'),at:now()});log(d,'Добавлены пояснения к спору');message='Пояснение добавлено';
}
else if(m.type==='settlement'){
if(!d||d.status!=='dispute_open'||!canDeal(d))throw Error('Нет активного спора.');
d.dispute.settlement={initiatedBy:state.userId,outcome:v('outcome'),stage:v('stage'),responsible:v('responsible'),note:v('note'),acceptedBy:[state.userId],version:(d.dispute.settlement?.version||0)+1,createdAt:now()};log(d,'Предложено соглашение по спору');message='Соглашение отправлено на согласование';
}
else if(m.type==='payment'){
if(!d||!canDeal(d))throw Error('Нет доступа к расчётам.');const paid=num('amount',0);if(!Number.isFinite(paid)||paid<0)throw Error('Оплаченная сумма не может быть отрицательной.');if(d.terms.priceType==='fixed'&&paid>Number(d.terms.price))throw Error('Оплаченная сумма превышает фиксированную стоимость сделки.');d.finance.paid=paid;log(d,'Обновлена запись об оплате: '+money(paid));message='Учётная сумма оплаты обновлена (без реального платежа)';
}
else if(m.type==='reset'){state=initial();message='Демо возвращено к исходным данным';navigateAfter={view:'home'};}
else return;
}catch(err){addToast(err.message||'Не удалось выполнить действие',true);return;}
modal=null;
if(navigateAfter){state.view=navigateAfter.view;state.selectedRequestId=navigateAfter.view==='request'?navigateAfter.id:null;state.selectedDealId=navigateAfter.view==='deal'?navigateAfter.id:null;}
save();render();addToast(message);
}
function act(action,el){const id=el.dataset.id,requestId=el.dataset.request,lawyerId=el.dataset.lawyer;
if(action==='go'){nav(el.dataset.view);return;}
if(action==='open-request'){nav('request',id);return;}
if(action==='open-deal'){nav('deal',id);return;}
if(action==='toggle-side'){sideOpen=!sideOpen;render();return;}
if(action==='set-filter'){state.filter=el.dataset.filter;save();render();return;}
if(action==='close-modal'){close();return;}
if(action==='close-overlay'){if(el.classList.contains('modal-backdrop'))close();return;}
if(action==='new-request'){open('request');return;}
if(action==='edit-request'){open('request',{id});return;}
if(action==='offer'){open('offer',{id});return;}
if(action==='chat'){open('chat',{requestId,lawyerId});return;}
if(action==='select-offer'){const o=offer(id),r=o&&req(o.requestId);if(!o||!r||stale(o,r)||preliminary(o)){addToast('Выберите актуальный отклик с окончательными условиями',true);return;}open('select',{id});return;}
if(action==='materials'){open('materials',{id});return;}
if(action==='start-work'){const d=deal(id);if(!d||d.status!=='selected'||state.userId!==d.lawyerId){addToast('Начать работу может только выбранный исполнитель',true);return;}
if(!d.materialsProvided){addToast('Для начала нужны исходные материалы от клиента',true);return;}
const needed=d.terms.priceType==='fixed'?Number(d.terms.price)*(Number(d.terms.prepaymentPercent)||0)/100:0;
if(Number(d.finance.paid)<needed){addToast('Ожидается согласованная предоплата: '+money(needed),true);return;}
change(()=>{d.status='in_work';log(d,'Исполнитель начал работу');});addToast('Работа начата');return;}
if(action==='submit-work'){open('submit',{id});return;}
if(action==='accept'){open('accept',{id});return;}
if(action==='request-revision'){open('revision',{id});return;}
if(action==='change-terms'){const d=deal(id);if(d?.change){addToast('Сначала согласуйте или отзовите действующие изменения',true);return;}open('change',{id});return;}
if(action==='approve-change'){const d=deal(id);if(!d||!d.change||d.change.initiatedBy===state.userId||!canDeal(d)){addToast('Нет ожидающих изменений',true);return;}change(()=>{d.terms=d.change.terms;d.termsVersion=d.change.version;d.change=null;log(d,'Обе стороны согласовали изменения условий v'+d.termsVersion);});addToast('Новая версия условий вступила в силу');return;}
if(action==='withdraw-change'){const d=deal(id);if(!d||!d.change||d.change.initiatedBy!==state.userId)return;change(()=>{d.change=null;log(d,'Предложение об изменении условий отозвано');});addToast('Предложение отозвано');return;}
if(action==='terminate'){open('terminate',{id});return;}
if(action==='respond-termination'){open('respond-termination',{id});return;}
if(action==='withdraw-termination'){const d=deal(id);if(!d||d.status!=='termination_requested'||d.termination?.initiatedBy!==state.userId)return;change(()=>{d.termination.status='withdrawn';d.status=d.previousStatus||'in_work';log(d,'Предложение о прекращении отозвано');});addToast('Сделка вернулась на прежний этап');return;}
if(action==='dispute'){open('dispute',{id});return;}
if(action==='dispute-answer'){open('dispute-answer',{id});return;}
if(action==='settlement'){open('settlement',{id});return;}
if(action==='approve-settlement'){const d=deal(id),s=d?.dispute?.settlement;if(!d||d.status!=='dispute_open'||!s||s.acceptedBy.includes(state.userId)||!canDeal(d)){addToast('Невозможно подтвердить соглашение',true);return;}if(s.outcome==='accept'&&!d.submissions.length){addToast('Нет сдачи для приёмки',true);return;}
change(()=>{s.acceptedBy.push(state.userId);if(s.acceptedBy.length===2){if(s.outcome==='continue')d.status=s.stage;else if(s.outcome==='terminate'){d.status='terminated';d.termination={initiatedBy:s.initiatedBy,status:'accepted',reason:'Соглашение в споре',completedPart:'По соглашению',transferTerms:s.note,materials:'',version:1};}else if(s.outcome==='accept'){const last=d.submissions.at(-1);if(!last){addToast('Нет сдачи для приёмки',true);return;}d.acceptance={submissionId:last.id,submissionVersion:last.version,by:d.clientId,at:now()};d.status='completed';}log(d,'Обе стороны согласовали исход спора: '+s.outcome);}});addToast('Соглашение подтверждено');return;}
if(action==='payment'){open('payment',{id});return;}
if(action==='help'){open('help');return;}
if(action==='reset'){open('reset');return;}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;if(el.dataset.action==='close-overlay'&&ev.target!==el)return;act(el.dataset.action,el);});
document.addEventListener('input',ev=>{if(modal?.type==='request'&&ev.target.id==='f-happened'){const title=document.querySelector('#f-title');if(title&&!title.value.trim()){const proposed=String(ev.target.value||'').split(/[.!?\n]/)[0].trim().slice(0,100);if(proposed.length>12)title.value=proposed;}}});
document.addEventListener('change',ev=>{if(ev.target.id==='role-switch'){state.userId=ev.target.value;state.view='home';state.selectedRequestId=null;state.selectedDealId=null;modal=null;sideOpen=false;save();render();addToast('Вы вошли в демо как '+user().name);}});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='modal-form')submitModal(ev.target);else if(ev.target.id==='search-market'){state.search=String(new FormData(ev.target).get('q')||'');save();render();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal)close();});
render();
})();
</script>
