<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162525">
  <title>SMSN — скоро открытие</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #162525; color: #faf8ef; font-family: Inter, system-ui, sans-serif; }
    main { min-height: 100vh; min-height: 100svh; display: grid; align-content: center; padding: clamp(1.5rem, 8vw, 8rem); }
    h1 { margin: 0; font-size: clamp(4rem, 18vw, 17rem); line-height: 1; letter-spacing: -.07em; }
    p { display: flex; align-items: center; gap: .8rem; margin: 1.7rem 0 0; font-size: clamp(1rem, 2vw, 1.5rem); }
    p::before { content: ""; width: 2.5rem; height: .2rem; background: #c4ef90; }
  </style>
</head>
<body>
  <main>
    <h1>SMSN</h1>
    <p>Готовим сайт к запуску.</p>
  </main>
</body>
</html>
